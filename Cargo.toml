[package]
name = "beanstalkr"
version = "0.1.0"
authors = ["YahanLin"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4", features = ["derive"] }
strum = "0.25"
strum_macros = "0.25"
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["serde", "v4"] }
async-stream = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
downcast-rs = "1.2"
min-max-heap = "1.3.0"
async-trait = "0.1"
lazy_static = "1.4"
futures = "0.3"
futures-timer = "3.0"
# fasthash = "0.4"
beanstalkc = "^0.2.0"
failure = "0.1"
ctrlc = { version = "3.4", features = ["termination"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
hostname = "0.3"
libc = "0.2"
bytes = "1.5"
crc32fast = "1.3"
fs4 = "0.12"

[profile.release]
debug = true
